name: Build and Package Fixture Release
description: Build test fixtures and package them for release
inputs:
  release_name:
    description: "Name of the fixture release"
    required: true
  from_fork:
    description: "Fill from this fork (inclusive). Empty for unsplit builds."
    default: ""
  until_fork:
    description: "Fill until this fork (inclusive). Empty for unsplit builds."
    default: ""
  split_label:
    description: "Label for this split artifact. Empty for unsplit builds."
    default: ""
  splits:
    description: "Total number of grouped-split groups (>=2 enables grouped-split)."
    default: "1"
  group:
    description: "1-based group index when splits>=2."
    default: "1"
  use_pre_alloc_groups:
    description: "Pass --use-pre-alloc-groups when 'true'."
    default: "false"
  store_durations:
    description: "Pass --store-durations (and upload durations__<label>) when 'true'."
    default: "false"
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-uv
      with:
        enable-cache: "false"
    - uses: ./.github/actions/setup-env
    - name: Install EEST
      shell: bash
      run: uv sync --no-progress
    - name: Extract fixture release properties from config
      id: properties
      shell: bash
      env:
        RELEASE_NAME: ${{ inputs.release_name }}
      run: |
        echo "release_name=${RELEASE_NAME}"
        uv run -q .github/scripts/get_release_props.py "${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
    - uses: ./.github/actions/build-evm-base
      id: evm-builder
      with:
        type: ${{ steps.properties.outputs.evm-type }}
    - name: Install pigz for parallel tarball compression
      if: inputs.split_label == ''
      shell: bash
      run: sudo apt-get install -y pigz
    - name: Generate fixtures using fill
      shell: bash
      env:
        RELEASE_NAME: ${{ inputs.release_name }}
        SPLIT_LABEL: ${{ inputs.split_label }}
        FROM_FORK: ${{ inputs.from_fork }}
        UNTIL_FORK: ${{ inputs.until_fork }}
        SPLITS: ${{ inputs.splits }}
        GROUP: ${{ inputs.group }}
        USE_PRE_ALLOC_GROUPS: ${{ inputs.use_pre_alloc_groups }}
        STORE_DURATIONS: ${{ inputs.store_durations }}
        FILL_PARAMS: ${{ steps.properties.outputs.fill-params }}
        X_DIST: ${{ steps.evm-builder.outputs.x-dist }}
        EVM_IMPL: ${{ steps.evm-builder.outputs.impl }}
        EVM_BIN: ${{ steps.evm-builder.outputs.evm-bin }}
      run: |
        if [ -n "$SPLIT_LABEL" ]; then
          OUTPUT_ARG="--output=fixtures_${RELEASE_NAME}"
        else
          OUTPUT_ARG="--output=fixtures_${RELEASE_NAME}.tar.gz"
        fi

        FORK_ARGS=""
        if [ -n "$FROM_FORK" ]; then
          FORK_ARGS="--from=$FROM_FORK --until=$UNTIL_FORK"
        fi

        SPLIT_ARGS=""
        if [ "$SPLITS" -ge 2 ]; then
          SPLIT_ARGS="--grouped-split --splits=$SPLITS --group=$GROUP --durations-path=.test_durations"
        fi

        EXTRA_ARGS=""
        if [ "$USE_PRE_ALLOC_GROUPS" = "true" ]; then
          EXTRA_ARGS="$EXTRA_ARGS --use-pre-alloc-groups"
        fi
        if [ "$STORE_DURATIONS" = "true" ]; then
          EXTRA_ARGS="$EXTRA_ARGS --store-durations"
        fi

        EVM_ARG=""
        if [ "$EVM_IMPL" != "eels" ]; then
          EVM_ARG="--evm-bin=$EVM_BIN"
        fi

        # Exit code 5 (NO_TESTS_COLLECTED) is tolerable for fork ranges
        # or grouped-split groups that end up empty; any other nonzero
        # exit is a real error.
        set +e
        uv run fill -n "$X_DIST" $EVM_ARG $FILL_PARAMS $FORK_ARGS \
          $SPLIT_ARGS $EXTRA_ARGS $OUTPUT_ARG \
          --build-name "$RELEASE_NAME" --no-html \
          --durations=100 --log-level=DEBUG
        EXIT_CODE=$?
        set -e
        if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 5 ]; then
          exit "$EXIT_CODE"
        fi
    - name: Generate Benchmark Genesis Files
      if: inputs.split_label == '' && contains(inputs.release_name, 'benchmark')
      uses: ./.github/actions/build-benchmark-genesis
      with:
        fixtures_path: fixtures_${{ inputs.release_name }}.tar.gz
    - name: Upload Benchmark Genesis Artifact
      if: inputs.split_label == '' && contains(inputs.release_name, 'benchmark')
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: benchmark_genesis_${{ inputs.release_name }}
        path: benchmark_genesis.tar.gz
    - name: Upload fixture tarball (unsplit)
      if: inputs.split_label == ''
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: fixtures_${{ inputs.release_name }}
        path: fixtures_${{ inputs.release_name }}.tar.gz
    - name: Upload fixture directory (split)
      if: inputs.split_label != ''
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: fixtures__${{ inputs.split_label }}
        include-hidden-files: true
        path: fixtures_${{ inputs.release_name }}/
        if-no-files-found: ignore
    - name: Upload per-split durations
      if: inputs.store_durations == 'true' && inputs.split_label != ''
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: durations__${{ inputs.split_label }}
        include-hidden-files: true
        path: .test_durations
        if-no-files-found: ignore
